<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <header>
    <div class="navbar">
      <div class="logo">
        <img src="amazon.png" alt="Amazon Logo">
      </div>
      <input type="text" placeholder="Search Amazon.in" class="search-box">
      <div class="nav-links">
        <a href="#">Sign In</a>
        <a href="#">Orders</a>
        <a href="#">Cart</a>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="banner">
    <img src="upscalemedia-transformed (1).jpeg" alt="Sale Banner">
  </section>

  <!-- Accessories Section -->
  <section class="accessories">
    <h2>Top Accessories</h2>
    <div class="accessory-grid">
      <div class="item">
        <img src="headphone i.webp" alt="Headphones">
        <p>Wireless Headphones</p>
      </div>
      <div class="item">
        <img src="smartwatch.jpg" alt="Smart Watch">
        <p>Smart Watch</p>
      </div>
      <div class="item">
        <img src="backpack.jpg" alt="Backpack">
        <p>Backpack</p>
      </div>
      <div class="item">
        <img src="bluetooth speaker.avif" alt="Bluetooth Speaker">
        <p>Bluetooth Speaker</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; sit Amazon Clone - sawan kr. mahto</p>
  </footer>
</body>
</html>
